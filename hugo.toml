    parent = "home"
    name = "tech"
    url = "/posts/tech/"
    weight = 1

  [[menu.main]]
    identifier = "ss2"
    parent = "home"
    name = "life"
    url = "/posts/life/"
    weight = 2

  [[menu.main]]
    identifier = "archives"
    name = "📜 归档"
    url = "/archives/"
    weight = 2
    

  [[menu.main]]
    identifier = "about"
    name = "👤 关于"
    url = "/about/"
    weight = 3

[taxonomies]
  category = "categories"
  tag = "tags"

  [markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 2