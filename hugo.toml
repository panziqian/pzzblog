baseURL = "https://pzzblog.netlify.app/"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
title = "pzzの博客"
theme = "hugo-theme-stack"

[params]
    description = "一个使用 Hugo & Stack 搭建的博客"
    mainSections = ["posts"]

    [params.footer]
        since = 2026

    [params.sidebar]
        compact = false
        avatar = "/img/avatar.jpg"
        subtitle = "一个使用 Hugo & Stack 搭建的博客"

    [params.article]
        math = true
        toc = true
        readingTime = true

        [params.article.license]
            enabled = false

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "categories", params = { limit = 10 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        page = [
            { type = "toc" },
        ]

    [params.colorScheme]
        toggle = true
        default = "auto"

    [params.comments]
        enabled = false

    [params.cookies]
        enabled = false

[languages]
  [languages.zh]
    languageCode = "zh-cn"
    languageName = "简体中文"
    title = "pzzの博客"
    weight = 1
  [languages.en]
    languageCode = "en-us"
    languageName = "English"
    title = "pzzの博客"
    weight = 2

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 2

[imaging]
  resampleFilter = "CatmullRom"
  quality = 75
