baseURL = "https://pzzblog.netlify.app/"
languageCode = "zh-cn"
title = "pzzの博客"
theme = "zero"

[params]
  author = "KiritoBP"
  description = "一个使用 Hugo & PaperMod 搭建的博客"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowToc = true
  TocOpen = false
  defaultTheme = "auto" # 自动适配深色/浅色模式

[menu]
