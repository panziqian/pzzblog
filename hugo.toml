baseURL = "https://pzzblog.netlify.app/"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
title = "pzzの博客"
theme = "zero"

[params]
  author = "KiritoBP"
  description = "一个使用 Hugo & Zero 搭建的博客"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowToc = true
  TocOpen = false
  defaultTheme = "auto" # 自动适配深色/浅色模式
  math = true


[languages]
  [languages.zh]
    languageCode = "zh-cn"
    languageName = "简体中文"
    title = "pzzの博客"
    weight = 1
  [languages.en]
    languageCode = "en-us"
    languageName = "English"
    title = "pzzの博客"
    weight = 2

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
[markup.tableOfContents]
  startLevel = 1
  endLevel = 2

[imaging]
  resampleFilter = "CatmullRom"
  quality = 75